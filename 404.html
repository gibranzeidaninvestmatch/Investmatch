<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Page introuvable · InvestMatch</title>
<meta name="theme-color" content="#C9A84C"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0B1628;--navy-mid:#102040;--navy-light:#1A3358;
  --gold:#C9A84C;--gold-light:#E8C97A;--gold-dim:rgba(201,168,76,0.15);
  --white:#F0F4FA;--gray:#8A9BB5;
}
html,body{height:100%;background:var(--navy);color:var(--white);font-family:'DM Sans',sans-serif;}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;min-height:100vh;overflow:hidden;}

/* Fond animé */
.bg-glow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.bg-glow::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,76,0.06) 0%,transparent 70%);top:-120px;left:50%;transform:translateX(-50%);animation:pulse 6s ease-in-out infinite;}
.bg-glow::after{content:'';position:absolute;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(74,144,217,0.04) 0%,transparent 70%);bottom:-80px;right:-60px;animation:pulse 8s ease-in-out infinite reverse;}
@keyframes pulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.15)}}

.card{position:relative;z-index:1;background:var(--navy-mid);border:1px solid rgba(201,168,76,0.18);border-radius:28px;padding:52px 48px;max-width:480px;width:100%;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,0.5);animation:fadeUp .6s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

.logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;margin-bottom:36px;display:block;text-decoration:none;}
.logo span{color:var(--gold)}

.error-badge{display:inline-flex;align-items:center;gap:8px;padding:6px 16px;background:rgba(224,92,106,0.1);border:1px solid rgba(224,92,106,0.25);border-radius:100px;font-size:12px;font-weight:700;color:#F09090;letter-spacing:1px;text-transform:uppercase;margin-bottom:24px;}

.big-num{font-family:'Playfair Display',serif;font-size:96px;font-weight:900;line-height:1;color:var(--gold);margin-bottom:4px;text-shadow:0 0 60px rgba(201,168,76,0.25);}

h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--white);margin-bottom:12px;}

p{font-size:14px;color:var(--gray);line-height:1.7;max-width:340px;margin:0 auto 36px;}

.btn-primary{display:inline-flex;align-items:center;gap:8px;padding:14px 32px;border-radius:12px;background:var(--gold);color:var(--navy);border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none;transition:all .2s;margin-bottom:12px;width:100%;justify-content:center;}
.btn-primary:hover{background:var(--gold-light);transform:translateY(-1px)}

.btn-secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 32px;border-radius:12px;background:transparent;color:var(--gray);border:1px solid rgba(255,255,255,0.1);font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;transition:all .2s;}
.btn-secondary:hover{color:var(--white);border-color:rgba(255,255,255,0.2)}

.divider{height:1px;background:rgba(255,255,255,0.06);margin:24px 0;}

.footer-note{font-size:12px;color:rgba(138,155,181,0.4);margin-top:0;}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="card">
  <a href="/app.html" class="logo">Invest<span>Match</span></a>

  <div class="error-badge">
    <span>⚠</span> Erreur 404
  </div>

  <div class="big-num">404</div>

  <h1>Page introuvable</h1>
  <p>Cette page n'existe pas ou a été déplacée. Vérifiez l'URL ou retournez sur la plateforme.</p>

  <a href="/app.html" class="btn-primary">✦ Retour sur InvestMatch</a>
  <a href="javascript:history.back()" class="btn-secondary">← Page précédente</a>

  <div class="divider"></div>
  <p class="footer-note">Beta v2.0 · © 2025 InvestMatch</p>
</div>
</body>
</html>
